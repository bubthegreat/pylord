[server]
host = "0.0.0.0"
port = 2323

[game]
forest_fights_per_day = 15
player_fights_per_day = 3
flirts_per_day = 1
clean_mode = false
# Dragon kills that finish the realm (reference/lord.js:1852). 0 = never.
win_deeds = 3
# Require the strength/defense to carry what you buy (reference/lord.js:1866).
shop_limit = true
# Minutes of real time per recovered forest fight (0 disables). Not a
# lord.js mechanic -- see docs/deviations.md.
fight_regen_minutes = 15
# Gold for the first bought endurance point at Turgon's; each further point
# costs another multiple of this. Levelling up never raises it -- you pay
# for what you have trained.
endurance_cost = 1000

[igms]
# populated by bundled IGMs; true = enabled. Shipped IGMs are on by
# default -- the sysop turns off what they don't want.
baraks_house = true
sandtigers_bar = true
violets_cottage = true
turgons_house = true
warriors_graveyard = true
lord_casino = true

# Wave 2 -- recreations from the historical IGM catalogue (see
# docs/deviations.md and each igms/<name>/igm.py).
apothecary = true
gem_trader = true
old_skull_inn = true
abandoned_mines = true
arena_of_lords = true
the_latrine = true

# Wave 3 -- ports from the igms_to_port archive and documented
# recreations from surviving archive docs (see each igms/<name>/igm.py
# for the recorded/invented split).
werewolf = true
outlands_tavern = true
sunshines_fairy_land = true
kaldors_court = true
wishing_well = true
xenons_town_square = true

# Wave 4 -- ports from the GPL sources in reference/igm-sources/, which
# is a different archive from igms_to_port/: these have real readable
# source, so they are ports rather than recreations. They reproduce their
# originals' balance flaws deliberately -- the lottery reaches the
# two-billion gold ceiling at level 12, and Pickle's has no daily limit.
# See each igms/<name>/igm.py docstring and the IGM-ports table in
# docs/deviations.md before leaving them on.
lotto = true
pickle = true
oorphans = true
freeworld2 = true
