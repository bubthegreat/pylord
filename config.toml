[server]
host = "0.0.0.0"
port = 2323

[game]
forest_fights_per_day = 15
player_fights_per_day = 3
flirts_per_day = 1
clean_mode = false
# Dragon kills that finish the realm (reference/lord.js:1852). 0 = never.
win_deeds = 3
# Require the strength/defense to carry what you buy (reference/lord.js:1866).
shop_limit = true
# Minutes of real time per recovered forest fight (0 disables). Not a
# lord.js mechanic -- see docs/deviations.md.
fight_regen_minutes = 15
# Gold for the first bought endurance point at Turgon's; each further point
# costs another multiple of this. Levelling up never raises it -- you pay
# for what you have trained.
endurance_cost = 1000

[igms]
# populated by bundled IGMs; true = enabled
baraks_house = true
sandtigers_bar = true
violets_cottage = true
turgons_house = true
warriors_graveyard = true
lord_casino = true

# Wave 2 -- recreations from the historical IGM catalogue, shipped off
# by default (see docs/deviations.md and each igms/<name>/igm.py).
apothecary = false
gem_trader = false
old_skull_inn = false
abandoned_mines = false
arena_of_lords = false
the_latrine = false

# Wave 3 -- documented recreations ported from surviving archive docs
# (igms_to_port/, see each igms/<name>/igm.py for the recorded/invented
# split), shipped off by default.
werewolf = false
