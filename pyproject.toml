[project]
name = "pylord"
version = "0.1.6"
description = "Legend of the Red Dragon — Python telnet remake"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "cryptography>=49.0.0",
    "sqlalchemy>=2.0",
    "telnetlib3>=4.0.5",
]

[project.scripts]
pylord = "pylord.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Both, explicitly: hatchling would otherwise infer only the package named
# after the project, and a wheel without igms/ is a realm with no Other
# Places at all. The container has not noticed because uv installs the
# project editable, which puts the source root on sys.path.
packages = ["pylord", "igms"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
