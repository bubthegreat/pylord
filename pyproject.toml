[project]
name = "pylord"
version = "0.1.5"
description = "Legend of the Red Dragon — Python telnet remake"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "cryptography>=49.0.0",
    "sqlalchemy>=2.0",
    "telnetlib3>=4.0.5",
]

[project.scripts]
pylord = "pylord.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
