# Production realm on the homelab k3s cluster (namespace pylord-prod).
#
# The release workflow pins image.tag to the version it is cutting, in the
# same commit it tags. Argo tracks a semver range over those tags, so the
# tag it resolves and the image this file names are always the same
# release. Everything else here is hand-maintained.

image:
  tag: "d042da2"
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 2323
  # Left blank: MetalLB's general-pool (192.168.0.41-100) assigns one and
  # keeps it for the life of the Service.
  loadBalancerIP: ""

# Reachable from outside the LAN at https://lord.bubtaylor.com -- the
# wildcard DNS already points there, and cert-manager issues the cert.
# Telnet clients on the LAN still use the MetalLB address on 2323.
web:
  enabled: true

ingress:
  enabled: true
  host: lord.bubtaylor.com

# The realm lives in MySQL. The password is in the `pylord-db` Secret,
# created out of band -- see deploy/README.md's first-time setup.
mysql:
  enabled: true
  auth:
    existingSecret: pylord-db
  persistence:
    storageClass: longhorn-retain
    size: 8Gi

# No volume on the game pod: it holds nothing now.
persistence:
  enabled: false

# All twelve bundled IGMs are on in this realm. They ship inside the image.
igms:
  baraks_house: true
  sandtigers_bar: true
  violets_cottage: true
  turgons_house: true
  warriors_graveyard: true
  lord_casino: true
  apothecary: true
  gem_trader: true
  old_skull_inn: true
  abandoned_mines: true
  arena_of_lords: true
  the_latrine: true

game:
  forest_fights_per_day: 15
  player_fights_per_day: 3
  flirts_per_day: 1
  clean_mode: false
  win_deeds: 3
  shop_limit: true
  # One forest fight back every 15 real minutes, so dropping in for a few
  # minutes at lunch is worth doing.
  fight_regen_minutes: 15
  endurance_cost: 1000
