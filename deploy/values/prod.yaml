# Production realm on the homelab k3s cluster (namespace pylord-prod).
#
# CI rewrites image.tag on every push to the release branch; everything else
# here is hand-maintained.

image:
  tag: 2f9bb32
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 2323
  # Left blank: MetalLB's general-pool (192.168.0.41-100) assigns one and
  # keeps it for the life of the Service.
  loadBalancerIP: ""

# Reachable from outside the LAN at https://lord.bubtaylor.com -- the
# wildcard DNS already points there, and cert-manager issues the cert.
# Telnet clients on the LAN still use the MetalLB address on 2323.
web:
  enabled: true

ingress:
  enabled: true
  host: lord.bubtaylor.com

persistence:
  enabled: true
  storageClass: longhorn-retain
  size: 1Gi

# All twelve bundled IGMs are on in this realm. The chart seeds any that
# aren't on the volume yet (see the chart's init container).
igms:
  baraks_house: true
  sandtigers_bar: true
  violets_cottage: true
  turgons_house: true
  warriors_graveyard: true
  lord_casino: true
  apothecary: true
  gem_trader: true
  old_skull_inn: true
  abandoned_mines: true
  arena_of_lords: true
  the_latrine: true

game:
  forest_fights_per_day: 15
  player_fights_per_day: 3
  flirts_per_day: 1
  clean_mode: false
  win_deeds: 3
  shop_limit: true
  # One forest fight back every 15 real minutes, so dropping in for a few
  # minutes at lunch is worth doing.
  fight_regen_minutes: 15
  endurance_cost: 1000
