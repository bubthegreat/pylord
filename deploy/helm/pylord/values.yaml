# Defaults for the pylord chart. Environment overrides live in
# deploy/values/*.yaml; see deploy/README.md.

image:
  repository: bubthegreat/pylord
  # Overridden per environment (CI writes the commit tag into
  # deploy/values/prod.yaml). "latest" is only a sane local default.
  tag: latest
  pullPolicy: IfNotPresent

# One replica. On MySQL the storage no longer forces this, but the daily
# maintenance pass and the "already adventuring elsewhere" login check are
# not yet guarded across processes -- see deploy/README.md.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

service:
  # LoadBalancer gets the game its own address from MetalLB's general-pool
  # (192.168.0.41-100 on the homelab cluster), so players telnet straight to
  # it. Set type: ClusterIP instead if you route telnet through
  # ingress-nginx's tcp-services ConfigMap (the kbk pattern) -- see
  # deploy/README.md.
  type: LoadBalancer
  port: 2323
  # Pin an address here if you'd rather not let MetalLB choose.
  loadBalancerIP: ""
  annotations: {}

# Browser terminal (ttyd, a sidecar from the same image, wired to the game
# over localhost). This is how the realm is reachable from outside the LAN:
# an HTTP Ingress can't carry telnet, but it can carry this.
web:
  enabled: true
  port: 7681
  # ttyd's own title on the browser tab.
  title: "Legend of the Red Dragon"
  # Optional basic auth in front of the terminal, e.g. "sysop:hunter2".
  # Empty means anyone who reaches the host can play, which is the point.
  credential: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: false
  className: nginx
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    # Defaults to <fullname>-tls when blank.
    secretName: ""

# The realm's database.
#
# MySQL runs as its own Deployment in this chart (mysql.yaml). SQLite is
# still supported for local play -- set mysql.enabled: false and turn
# persistence on, and the game keeps its file on the PVC below.
mysql:
  enabled: true
  image: mysql:8.4
  database: lord
  user: lord
  auth:
    # Bring your own Secret (recommended): it must hold `password`,
    # `root-password` and `url` keys. See deploy/README.md.
    existingSecret: ""
    # Only used when existingSecret is empty. Rendering a chart never
    # generates one -- see templates/secret.yaml for why.
    password: ""
    rootPassword: ""
  persistence:
    storageClass: longhorn-retain
    size: 8Gi
  args:
    # Players sit at a menu for minutes at a time; the pool must not have
    # its connections cut out from under it while they think.
    - --wait_timeout=28800
    - --interactive_timeout=28800
    - --max_connections=200
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi

persistence:
  # Only needed when running on SQLite (mysql.enabled: false).
  enabled: false
  storageClass: longhorn-retain
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data
  # Reuse a volume that already exists rather than provisioning one.
  existingClaim: ""

# IGMs ship inside the image, so nothing but the SQLite file ever lives on
# that volume.

# Rendered into config.toml. Anything valid in the game's [game] table works;
# see the repo README for what each knob does.
game:
  forest_fights_per_day: 15
  player_fights_per_day: 3
  flirts_per_day: 1
  clean_mode: false
  win_deeds: 3
  shop_limit: true
  fight_regen_minutes: 15
  endurance_cost: 1000

# IGM enable/disable, rendered into config.toml's [igms] table.
igms:
  baraks_house: true
  sandtigers_bar: true
  violets_cottage: true
  turgons_house: true
  warriors_graveyard: true
  lord_casino: true
  # Wave 2 -- off by default; flip any of these on per environment.
  apothecary: false
  gem_trader: false
  old_skull_inn: false
  abandoned_mines: false
  arena_of_lords: false
  the_latrine: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The endpoint Kubernetes probes (pylord/health.py). Its own port, because
# probing the telnet port opened a session every few seconds and filled the
# log with connections that were never players.
health:
  port: 8080

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 30
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
commonLabels: {}
