{{- if and .Values.mysql.enabled (not .Values.mysql.auth.existingSecret) }}
{{- if not .Values.mysql.auth.password }}
{{- fail "mysql.auth.password is required when mysql.enabled and no mysql.auth.existingSecret is set. Passwords are never generated here: Argo re-renders this chart on every sync with no view of the cluster, so a generated one would rotate underneath a running database and lock the game out of it. Create a Secret out of band and point mysql.auth.existingSecret at it (see deploy/README.md), or set an explicit password for a throwaway environment." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "pylord.fullname" .) }}
  labels:
    {{- include "pylord.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.mysql.auth.password | quote }}
  root-password: {{ .Values.mysql.auth.rootPassword | default .Values.mysql.auth.password | quote }}
  # The game reads this whole URL, so the password never has to be
  # reassembled anywhere else.
  url: {{ include "pylord.dbUrl" . | quote }}
{{- end }}
