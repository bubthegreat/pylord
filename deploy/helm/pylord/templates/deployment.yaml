apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pylord.fullname" . }}
  labels:
    {{- include "pylord.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # SQLite has one writer and the volume is ReadWriteOnce: the old pod must
  # be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pylord.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pylord.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart on a config change -- the game reads config.toml once, at
        # startup.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Players are mid-session: give the connections a moment to close.
      terminationGracePeriodSeconds: 15
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pylord.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "pylord.fullname" . }}-config
        # The root filesystem is read-only; Python still wants a scratch dir.
        - name: tmp
          emptyDir: {}
      containers:
        - name: pylord
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["serve", "--config", "/config/config.toml"]
          ports:
            - name: telnet
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: telnet
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: telnet
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: telnet
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
        {{- if .Values.web.enabled }}
        # The browser terminal: ttyd runs a telnet client against the game
        # over the pod's loopback, so the only thing exposed over HTTP is a
        # session of the game itself.
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["ttyd"]
          args:
            - --port
            - {{ .Values.web.port | quote }}
            - --interface
            - "0.0.0.0"
            - --writable
            # ttyd 1.7 takes browser-side settings through --client-option
            # (there is no --title-format).
            - --client-option
            - {{ printf "titleFixed=%s" .Values.web.title | quote }}
            {{- with .Values.web.credential }}
            - --credential
            - {{ . | quote }}
            {{- end }}
            - telnet
            - 127.0.0.1
            - {{ .Values.service.port | quote }}
          ports:
            - name: web
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
