{{/*
config.toml, rendered from values.

On MySQL the database is deliberately absent here: it arrives as a whole
URL in PYLORD_DB_URL, from a Secret, because it carries a password. Writing
a SQLite path as well would give the game something to silently fall back
to if that variable ever went missing -- better that it fails loudly.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pylord.fullname" . }}-config
  labels:
    {{- include "pylord.labels" . | nindent 4 }}
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = {{ .Values.service.port }}
    health_port = {{ .Values.health.port }}
    {{- if not .Values.mysql.enabled }}
    db = "{{ .Values.persistence.mountPath }}/lord.db"
    {{- end }}

    [game]
    {{- range $key, $value := .Values.game }}
    {{ $key }} = {{ toJson $value }}
    {{- end }}

    [igms]
    {{- range $key, $value := .Values.igms }}
    {{ $key }} = {{ toJson $value }}
    {{- end }}
