{{- if .Values.ingress.enabled }}
{{- if not .Values.web.enabled }}
{{- fail "ingress.enabled requires web.enabled: an HTTP Ingress cannot carry telnet, only the browser terminal" }}
{{- end }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled requires ingress.host" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pylord.fullname" . }}
  labels:
    {{- include "pylord.labels" . | nindent 4 }}
  annotations:
    # The terminal is a long-lived websocket: don't cut it off mid-fight.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "pylord.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pylord.fullname" . }}
                port:
                  number: {{ .Values.web.port }}
{{- end }}
