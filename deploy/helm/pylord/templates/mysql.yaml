{{- if .Values.mysql.enabled }}
{{- $fullname := include "pylord.fullname" . }}
{{- $mysqlName := printf "%s-mysql" $fullname }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $mysqlName }}
  labels:
    {{- include "pylord.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
  annotations:
    # This volume holds every character in the realm: never let a teardown,
    # a prune, or a `tilt down` take it with them.
    tilt.dev/down-policy: keep
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.mysql.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mysql.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $mysqlName }}
  labels:
    {{- include "pylord.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "pylord.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $mysqlName }}
  labels:
    {{- include "pylord.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two mysqld processes must never have the
  # same data directory open, and the volume is ReadWriteOnce anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pylord.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        {{- include "pylord.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mysql
    spec:
      securityContext:
        # The mysql image's own uid/gid.
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          imagePullPolicy: IfNotPresent
          args:
            {{- toYaml .Values.mysql.args | nindent 12 }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pylord.dbSecretName" . }}
                  key: root-password
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pylord.dbSecretName" . }}
                  key: password
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          # mysqladmin ping answers as soon as the server accepts
          # connections, which is exactly what the game is waiting for.
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $mysqlName }}
{{- end }}
