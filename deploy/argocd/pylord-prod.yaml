# ArgoCD Application for the production realm.
#
# Copy this into the homelab-app-config repo's apps/ directory (the root
# app recurses it) and commit -- that is the whole deploy step. Nothing
# here is applied to the cluster by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pylord-prod
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: homelab
spec:
  project: default

  source:
    repoURL: https://github.com/bubthegreat/pylord.git
    # A semver range over release tags, not a branch. Argo resolves it to
    # the newest matching tag, so cutting v0.1.2 *is* the deploy -- there is
    # no promote job writing an image tag into a values file, and prod never
    # follows an untagged commit on main.
    targetRevision: ">=0.1.0"
    path: deploy/helm/pylord
    helm:
      releaseName: pylord
      valueFiles:
        - ../../values/prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: pylord-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    # Longhorn and the LoadBalancer controller write these back.
    - kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
        - /metadata/annotations
        - /metadata/finalizers
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/loadBalancerIP
