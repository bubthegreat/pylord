name: CI

on:
  push:
    # Not main: release.yml calls this workflow there, so running it here
    # too would double every job -- including the MySQL one.
    branches-ignore: [main]
  pull_request:
  # Called by release.yml, so a release cannot be cut past a red suite.
  workflow_call:

jobs:
  changes:
    name: What changed
    # The MySQL and image jobs cost ~2-3 minutes each and only tell us
    # anything when the engine, schema, image, or chart changed. IGM ports
    # (igms/ + tests/ + config.toml + deploy/values) are the common case
    # now and get the fast SQLite-only pipeline.
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'pylord/**'
              - 'Dockerfile'
              - 'deploy/helm/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Lint the Helm chart
        run: helm lint deploy/helm/pylord

      - name: Render the chart for every environment
        run: |
          for env in local prod; do
            helm template pylord deploy/helm/pylord \
              -f "deploy/values/${env}.yaml" > "/tmp/render-${env}.yaml"
          done

  mysql:
    name: Tests on MySQL
    # SQLite and MySQL disagree about enough -- upsert syntax, collations,
    # reserved words -- that a green suite on SQLite alone says nothing
    # about the database the homelab actually runs. Same tests, real server.
    # Skipped when nothing engine/schema-shaped changed (see `changes`).
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: lord
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Test
        # The suite gives each `:memory:` request its own database, so the
        # user needs CREATE DATABASE -- hence root against a throwaway
        # service container. See tests/conftest.py.
        env:
          PYLORD_TEST_DB_URL: mysql+aiomysql://root:ci@127.0.0.1:3306/lord?charset=utf8mb4
        run: uv run pytest -q

  image:
    name: Image runs the way the chart runs it
    # The chart deploys against MySQL and deliberately renders no SQLite
    # path, so the container needs a real database here too -- running it
    # any other way would not be "the way the chart runs it".
    # Skipped when nothing engine/image/chart-shaped changed (see `changes`).
    needs: [changes]
    if: needs.changes.outputs.engine == 'true'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: lord
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Build the image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pylord:ci
          cache-from: type=gha

      - name: Take the container's config and arguments from the chart
        run: |
          # Whatever the chart mounts and passes is what we run here -- an
          # image that only works with its own CMD is not deployable.
          helm template pylord deploy/helm/pylord \
            -f deploy/values/prod.yaml > /tmp/render.yaml
          mkdir -p /tmp/pylord-config /tmp/pylord-data
          chmod 777 /tmp/pylord-data  # the image runs as uid 10001
          uv run --with pyyaml python - <<'PY'
          import json, pathlib, yaml
          docs = [d for d in yaml.safe_load_all(pathlib.Path("/tmp/render.yaml").read_text()) if d]
          cm = next(d for d in docs if d["kind"] == "ConfigMap")
          pathlib.Path("/tmp/pylord-config/config.toml").write_text(cm["data"]["config.toml"])
          dep = next(d for d in docs if d["kind"] == "Deployment")
          args = dep["spec"]["template"]["spec"]["containers"][0]["args"]
          pathlib.Path("/tmp/args.json").write_text(json.dumps(args))
          print("chart args:", args)
          PY

      - name: Start it and play a hand
        run: |
          set -e
          docker run -d --name pylord-ci \
            --network host \
            -e PYLORD_DB_URL="mysql+aiomysql://root:ci@127.0.0.1:3306/lord?charset=utf8mb4" \
            -v /tmp/pylord-config:/config:ro \
            -v /tmp/pylord-data:/data \
            pylord:ci $(uv run python -c "import json;print(' '.join(json.load(open('/tmp/args.json'))))")

          # The realm should answer a real telnet client within a few seconds.
          uv run python - <<'PY'
          import socket, sys, time
          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 2323), timeout=5) as sock:
                      sock.settimeout(5)
                      banner = b""
                      while b"warrior" not in banner.lower() and len(banner) < 4096:
                          chunk = sock.recv(1024)
                          if not chunk:
                              break
                          banner += chunk
                      if b"warrior" in banner.lower():
                          print("realm answered:", banner[-120:])
                          sys.exit(0)
              except OSError:
                  time.sleep(1)
          sys.exit("no name prompt from the container within 30s")
          PY

      - name: The health endpoint answers the way the probes expect
        run: |
          # Checked whether or not the chart probes it yet: this is what
          # gates turning health.probes on, and a pod that never goes ready
          # is what happens if it is wrong.
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/healthz | grep -q alive
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/readyz | grep -q ready

      - name: The browser terminal serves the game
        run: |
          set -e
          # Same shape as the pod: the sidecar reaches the game over
          # loopback rather than over a published port.
          web_args=$(uv run --with pyyaml python - <<'PY'
          import pathlib, shlex, yaml
          docs = [d for d in yaml.safe_load_all(pathlib.Path("/tmp/render.yaml").read_text()) if d]
          dep = next(d for d in docs if d["kind"] == "Deployment")
          web = next(c for c in dep["spec"]["template"]["spec"]["containers"] if c["name"] == "web")
          assert web["command"] == ["ttyd"], web["command"]
          print(shlex.join(str(a) for a in web["args"]))
          PY
          )
          echo "chart web args: $web_args"
          # Kubernetes passes args as an array; shlex.join above quoted them,
          # so restore the words rather than letting the shell split
          # "titleFixed=Legend of the Red Dragon" into five arguments.
          eval "set -- $web_args"
          docker run -d --name pylord-web \
            --network host \
            --entrypoint ttyd \
            pylord:ci "$@"

          # Host networking, like the game container: in the pod these two
          # share a network namespace and talk over loopback, and a
          # `--network container:` join is not available against a container
          # that is itself on the host network.
          for _ in $(seq 1 20); do
            if body=$(curl -fsS --max-time 5 http://127.0.0.1:7681/ 2>/dev/null); then
              echo "terminal served $(printf %s "$body" | wc -c) bytes"
              printf %s "$body" | grep -qi "ttyd\|terminal" \
                && echo "and it is the ttyd page" && exit 0
            fi
            sleep 2
          done
          echo "the browser terminal never answered"
          docker logs pylord-web || true
          exit 1

      - name: Container logs
        if: always()
        run: |
          docker logs pylord-ci || true
          docker logs pylord-web || true
