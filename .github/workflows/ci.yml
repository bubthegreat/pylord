name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Lint the Helm chart
        run: helm lint deploy/helm/pylord

      - name: Render the chart for every environment
        run: |
          for env in local prod; do
            helm template pylord deploy/helm/pylord \
              -f "deploy/values/${env}.yaml" > "/tmp/render-${env}.yaml"
          done
